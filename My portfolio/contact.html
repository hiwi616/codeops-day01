<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact information and a contact form.">
  <meta name="author" content="Your Name">
  <title>Your Name | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <nav class="main-nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="education.html">Education &amp; Skills</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact information</h1>

    <section id="contact-info">
      <h2>Contact me at </h2>
      <ul>
        <li>Email: <a href="mailto:hiwotketema701@gmail.com">hiwotketema701@gmail.com</a></li>
        <li>Phone: <a href="tel:+251983074470">[+251983074470]</a></li>
        <li>GitHub: <a href="https://github.com/" target="_blank" rel="noopener">github.com/hiwi616</a></li>
      </ul>
    </section>

    <section id="contact-form">
      <h2>Send Me a Message</h2>
      <!--
        This form doesn't submit anywhere real (there's no backend/server).
        action="#" and a JS-free page just shows the browser's built-in
        validation working. That's normal and expected for a static
        HTML-only project like this one.
      -->
      <form action="#" method="get">

        <div class="form-row">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            id="full-name"
            name="full-name"
            required
            minlength="2"
            maxlength="60"
            placeholder="Jane Doe">
        </div>

        <div class="form-row">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="jane@example.com">
        </div>

        <div class="form-row">
          <label for="phone">Phone Number <small class="hint">(optional)</small></label>
          <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[0-9\-\+\s\(\)]{7,15}"
            placeholder="e.g. 0912-345-678">
        </div>

        <div class="form-row">
          <label for="birthdate">Date You'd Like a Reply By <small class="hint">(optional)</small></label>
          <input
            type="date"
            id="birthdate"
            name="reply-by">
        </div>

        <div class="form-row">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="">-- Choose a reason --</option>
            <option value="job">Job Opportunity</option>
            <option value="collab">Project Collaboration</option>
            <option value="feedback">Feedback on My Portfolio</option>
            <option value="other">Other</option>
          </select>
        </div>

        <fieldset class="form-row">
          <legend>Preferred way to hear back</legend>
          <input type="radio" id="reply-email" name="reply-method" value="email" checked>
          <label for="reply-email" style="display:inline; font-weight:400;">Email</label><br>
          <input type="radio" id="reply-phone" name="reply-method" value="phone">
          <label for="reply-phone" style="display:inline; font-weight:400;">Phone</label>
        </fieldset>

        <div class="form-row">
          <label for="urgency">How urgent is this? (1 = low, 5 = high)</label>
          <input
            type="range"
            id="urgency"
            name="urgency"
            min="1"
            max="5"
            value="3">
        </div>

        <div class="form-row">
          <label for="portfolio-url">Your Website/Portfolio <small class="hint">(optional)</small></label>
          <input
            type="url"
            id="portfolio-url"
            name="portfolio-url"
            placeholder="https://yourwebsite.com">
        </div>

        <div class="form-row">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            minlength="10"
            maxlength="500"
            placeholder="Write your message here (10-500 characters)."></textarea>
        </div>

        <div class="form-row" style="flex-direction: row; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="consent" name="consent" required style="width:auto;">
          <label for="consent" style="font-weight:400; margin:0;">
            I agree to be contacted back about this message.
          </label>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Built as an HTML Portfolio Project.</p>
  </footer>

</body>
</html>
