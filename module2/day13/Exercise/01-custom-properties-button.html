<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 1 - Custom Properties</title>
  <style>
    :root {
      /* Two colors */
      --color-primary: #1f5c3a;
      --color-primary-hover: #164a2e;
      /* One spacing value */
      --space-md: 16px;
      /* One font stack */
      --font-stack: "Segoe UI", Roboto, sans-serif;
    }

    body {
      font-family: var(--font-stack);
      padding: 40px;
      background: #f4f1ea;
    }

    .styled-btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: var(--space-md) calc(var(--space-md) * 2);
      font-family: var(--font-stack);
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .styled-btn:hover {
      background: var(--color-primary-hover);
    }
  </style>
</head>
<body>

  <h1>Exercise 1: Custom Properties</h1>
  <p>
    This button's background color, hover color, padding, and font
    all come from the four custom properties declared in
    <code>:root</code>, applied with <code>var()</code>.
  </p>

  <button class="styled-btn">Click Me</button>

</body>
</html>
